<!doctype html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
  <meta charset="utf-8">
  <!-- The CSP comes first so it covers everything after it. Nothing loads
       from another origin; no inline script or style anywhere. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Flags</title>
  <!-- Install / home screen. Paths are relative: Pages serves from /flags/. -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" sizes="180x180">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Flags">
  <!-- The UI font (css/style.css), fetched in parallel with the CSS
       instead of after it, so the fallback rarely shows. -->
  <link rel="preload" href="./fonts/CourierPrime-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="./fonts/CourierPrime-Bold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/question.css">
  <link rel="stylesheet" href="./css/practice.css">
  <link rel="stylesheet" href="./css/test.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <main class="app">
    <!-- One section per view; js/app.js shows one at a time. -->
    <section id="view-home" class="view view-home" tabindex="-1">
      <p class="status">Loading…</p>
    </section>
    <section id="view-practice" class="view view-practice" tabindex="-1" hidden></section>
    <section id="view-test" class="view view-test" tabindex="-1" hidden></section>
    <section id="view-results" class="view view-results" tabindex="-1" hidden></section>
    <noscript><p class="status">Flags needs JavaScript.</p></noscript>
  </main>
</body>
</html>
